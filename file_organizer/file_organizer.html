<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrganizeIt — Smart File Organizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #070e1c;
      --bg-card: rgba(15, 23, 42, 0.75);
      --border-color: rgba(255, 255, 255, 0.12);
      --border-glow: rgba(6, 182, 212, 0.35);
      --text-main: #f3f4f6;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-indigo: #6366f1;
      --accent-green: #10b981;
      --accent-danger: #ef4444;
      --gradient-brand: linear-gradient(135deg, #06b6d4 0%, #3b82f6 50%, #6366f1 100%);
      --gradient-btn: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
      --gradient-btn-hover: linear-gradient(135deg, #06b6d4 0%, #6366f1 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 2.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 900px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 2.5rem; }

    .brand-logo {
      font-family: 'Outfit', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      background: var(--gradient-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      margin-bottom: 2rem;
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .input-group { position: relative; display: flex; align-items: center; }

    .input-icon {
      position: absolute;
      left: 1.2rem;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .form-input {
      width: 100%;
      background: rgba(10, 16, 30, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem 1rem 1rem 3rem;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.25);
    }

    .btn-group { display: flex; gap: 1rem; margin-top: 1rem; }

    .btn-action {
      background: var(--gradient-btn);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.9rem 1.75rem;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
      flex: 1;
    }

    .btn-action:hover {
      background: var(--gradient-btn-hover);
      transform: translateY(-2px);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .category-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .category-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .preset-pills {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }

    .preset-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-pill:hover {
      background: rgba(6, 182, 212, 0.2);
      color: #fff;
      border-color: var(--accent-cyan);
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: #1e293b;
      border: 1px solid var(--accent-cyan);
      color: #fff;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      font-size: 0.9rem;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="brand-logo"><i class="fa-solid fa-folder-tree"></i> OrganizeIt</h1>
      <p style="color: var(--text-muted);">Automatically sort your files into Images, Documents, Videos, Audio, and Archives.</p>
    </header>

    <!-- Scan & Organize Card -->
    <section class="card">
      <div class="card-title">
        <i class="fa-solid fa-folder-open" style="color: var(--accent-cyan);"></i>
        <span>Select Target Directory</span>
      </div>

      <form id="organizeForm">
        <div class="input-group">
          <i class="fa-solid fa-folder input-icon"></i>
          <input type="text" id="dirInput" class="form-input" placeholder="Enter absolute folder path (e.g., C:\Users\Username\Downloads)" required>
        </div>

        <div class="preset-pills">
          <span style="font-size: 0.8rem; color: var(--text-muted); align-self: center;">Quick Select:</span>
          <button type="button" class="preset-pill" onclick="setDir('C:\\Users\\' + (window.location.href.includes('localhost') ? 'YourUsername' : 'YourUsername') + '\\Downloads')">Downloads Folder</button>
        </div>

        <div class="btn-group">
          <button type="button" class="btn-action" id="btnScan" style="background: rgba(255,255,255,0.08);">
            <i class="fa-solid fa-magnifying-glass"></i> Scan Folder
          </button>
          <button type="submit" class="btn-action" id="btnOrganize">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Organize Files
          </button>
        </div>
      </form>
    </section>

    <!-- Category Preview Grid -->
    <section class="card" id="scanResults" style="display: none;">
      <div class="card-title" style="justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 0.6rem;">
          <i class="fa-solid fa-chart-pie" style="color: var(--accent-indigo);"></i>
          <span>Scan Inspection Results</span>
        </div>
        <span style="font-size: 0.85rem; color: var(--text-muted);" id="totalFilesText">0 files found</span>
      </div>

      <div class="category-grid" id="categoryGrid">
        <!-- Injected via JS -->
      </div>
    </section>

    <!-- Logs Summary -->
    <section class="card" id="logSection" style="display: none;">
      <div class="card-title">
        <i class="fa-solid fa-circle-check" style="color: var(--accent-green);"></i>
        <span>Organization Complete</span>
      </div>
      <div id="logContent" style="background: rgba(0,0,0,0.3); padding: 1rem; border-radius: 10px; font-family: monospace; font-size: 0.9rem; color: var(--accent-cyan); max-height: 200px; overflow-y: auto;">
      </div>
    </section>
  </div>

  <div class="toast" id="toast">
    <span id="toastMsg">Action completed</span>
  </div>

  <script>
    function setDir(path) {
      document.getElementById('dirInput').value = path;
    }

    const catMeta = {
      'Images': { icon: 'fa-image', color: '#10b981', bg: 'rgba(16, 185, 129, 0.15)' },
      'Documents': { icon: 'fa-file-lines', color: '#3b82f6', bg: 'rgba(59, 130, 246, 0.15)' },
      'Videos': { icon: 'fa-video', color: '#ec4899', bg: 'rgba(236, 72, 153, 0.15)' },
      'Audio': { icon: 'fa-music', color: '#f59e0b', bg: 'rgba(245, 158, 11, 0.15)' },
      'Archives': { icon: 'fa-file-zipper', color: '#8b5cf6', bg: 'rgba(139, 92, 246, 0.15)' },
      'Others': { icon: 'fa-file', color: '#94a3b8', bg: 'rgba(148, 163, 184, 0.15)' }
    };

    document.getElementById('btnScan').addEventListener('click', async () => {
      const dir = document.getElementById('dirInput').value.trim();
      if (!dir) return;

      const res = await fetch('/api/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ directory: dir })
      });
      const data = await res.json();
      if (res.ok) {
        renderScan(data.categories, data.unorganized_count, data.total_files);
        showToast(`Scan complete: ${data.total_files} files inspected`);
      } else {
        showToast(data.error || 'Failed to scan directory', true);
      }
    });

    document.getElementById('organizeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const dir = document.getElementById('dirInput').value.trim();
      if (!dir) return;

      const btn = document.getElementById('btnOrganize');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Organizing...';

      try {
        const res = await fetch('/api/organize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ directory: dir })
        });
        const contentType = res.headers.get('content-type') || '';
        const data = contentType.includes('application/json')
          ? await res.json()
          : { error: `Server returned HTTP ${res.status}. Check the application console.` };
        if (res.ok) {
          showToast(`Organized ${data.moved_count} file(s)!`);
          document.getElementById('logSection').style.display = 'block';
          document.getElementById('logContent').innerText = data.logs.join('\n') || 'No unorganized files found.';
          document.getElementById('btnScan').click();
        } else {
          showToast(data.error || 'Failed to organize', true);
        }
      } catch (err) {
        showToast(`Error organizing files: ${err.message}`, true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Organize Files';
      }
    });

    function renderScan(categories, unorganizedCount, total) {
      document.getElementById('scanResults').style.display = 'block';
      const textElem = document.getElementById('totalFilesText');
      if (unorganizedCount > 0) {
        textElem.innerHTML = `<span style="color: #22d3ee; font-weight: 600;">⚡ ${unorganizedCount} loose file(s) ready to organize</span> (${total} total managed)`;
      } else {
        textElem.innerHTML = `<span style="color: #34d399; font-weight: 600;">✅ Folder is fully organized!</span> (${total} files in category subfolders)`;
      }

      const grid = document.getElementById('categoryGrid');
      grid.innerHTML = Object.entries(categories).map(([cat, count]) => {
        const meta = catMeta[cat] || catMeta['Others'];
        return `
          <div class="category-card">
            <div class="category-icon" style="background: ${meta.bg}; color: ${meta.color};">
              <i class="fa-solid ${meta.icon}"></i>
            </div>
            <div>
              <div style="font-weight: 600; font-size: 1rem;">${cat}</div>
              <div style="font-size: 0.85rem; color: var(--text-muted);">${count} file(s)</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.style.borderColor = isError ? 'var(--accent-danger)' : 'var(--accent-cyan)';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
